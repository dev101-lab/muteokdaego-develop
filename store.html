<main>

<!-- ============ 가게 히어로 ============ -->
<section class="store-hero">
  <div class="container store-hero-layout">
    <div class="store-hero-copy reveal">
      <a class="store-back" href="map.html">← 경사로 지도로 돌아가기</a>
      <div class="store-badges">
        <span class="badge" id="storeCat"></span>
        <span class="badge-meta" id="storeDong"></span>
        <span class="badge-meta" id="storeDate"></span>
      </div>
      <h1 id="storeName"></h1>
      <p class="store-address" id="storeAddress"></p>
      <p class="store-desc" id="storeDesc"></p>
      <div class="store-cards">
        <div class="io-card before"><p class="io-label">BEFORE</p><p id="storeBefore"></p></div>
        <div class="io-card after"><p class="io-label">AFTER</p><p id="storeAfter"></p></div>
      </div>
    </div>
    <div class="store-ramp-type reveal">
      <img id="storeRampSticker" src="assets/img/sticker-all-wheels.png" alt="">
      <p>이 가게의 경사로</p>
      <strong id="storeRampType"></strong>
    </div>
  </div>
</section>

<!-- ============ 설치 전후 비교 ============ -->
<section class="section" style="background:#fff">
  <div class="container">
    <p class="store-section-eyebrow">BEFORE / AFTER</p>
    <h2 class="store-section-title" id="baTitle">설치 전후 비교</h2>
    <div class="store-ba reveal">
      <div class="ba" data-ba id="storeBA"></div>
      <p style="text-align:center; margin-top:14px; font-size:0.88rem; color:var(--ink-soft)">← 드래그해서 비교 →</p>
    </div>
  </div>
</section>

<!-- ============ 현장의 기록 ============ -->
<section class="section" style="padding-top: 24px; background:#fff">
  <div class="container">
    <p class="store-section-eyebrow" id="storyLabel">INSTALLATION NOTE</p>
    <h2 class="store-section-title">이곳에 경사로를 놓은 이유</h2>
    <article class="store-story-card reveal">
      <span class="store-story-mark" aria-hidden="true">“</span>
      <p id="storeStory"></p>
      <footer><strong id="storeStoryName"></strong><span id="storeStoryMeta"></span></footer>
    </article>
    <div class="store-story-followup">
      <h3>인터뷰와 현장 사진은 계속 보태집니다</h3>
      <p>인터뷰가 있는 가게에는 실제 목소리를, 아직 인터뷰 전인 가게에는 설치를 결정한 이유를 기록합니다.</p>
    </div>
    <div class="store-next">
      <a class="btn btn-black" href="map.html">다른 가게 기록 보기</a>

  </div>
</section>
